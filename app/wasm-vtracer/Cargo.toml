[package]
name = "playbook-vtracer-wasm"
version = "0.6.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
visioncortex = "0.8.8"
wasm-bindgen = "0.2"
fastrand = "2"

[profile.release]
opt-level = "s"
lto = true
